modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "assets/${mod_id}/icon.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "flyimpact.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "poopsky"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19.0.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "touhou_little_maid"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "patchouli"
type = "optional"
versionRange = "[1.21-87,)"
ordering = "AFTER"
side = "BOTH"
